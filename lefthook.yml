pre-commit:
  parallel: false
  jobs:
    - name: oxfmt
      glob: '*.{js,jsx,mjs,cjs,ts,tsx,json,jsonc,css,html,md,yaml,yml,toml}'
      exclude:
        - 'src/payload/migrations/**'
        # Generated by Payload and ignored by both tools: alone, they left oxfmt
        # with no target file and the commit aborted.
        - 'src/payload/payload-types.ts'
        - 'src/payload/payload-generated-schema.ts'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    - name: oxlint
      glob: '*.{js,jsx,mjs,cjs,ts,tsx}'
      exclude:
        - 'src/payload/migrations/**'
        # Generated by Payload and ignored by both tools: alone, they left oxfmt
        # with no target file and the commit aborted.
        - 'src/payload/payload-types.ts'
        - 'src/payload/payload-generated-schema.ts'
      run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
