services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nature-urbaine
    ports:
      - '5434:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  maildev:
    image: maildev/maildev:2.2.1
    ports:
      - '1080:1080'
      - '1025:1025'

  # S3-compatible object store, so local uploads take the same path as the
  # Railway bucket (presigned URLs, `_objectKey` folders, storage:check).
  # MinIO no longer publishes public images; RustFS is its drop-in replacement.
  # Ports 9100/9101, not 9000/9001, so it can run alongside the inca stack.
  objectstore:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: rustfs
      RUSTFS_SECRET_KEY: rustfs-dev-secret
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - objectstore-data:/data

  objectstore-init:
    image: rustfs/rc:v0.1.36
    depends_on:
      - objectstore
    entrypoint:
      - /bin/sh
      - -c
      - |
        rc alias set local http://objectstore:9000 rustfs rustfs-dev-secret
        until rc bucket create local/nature-urbaine --ignore-existing; do
          sleep 1
        done

volumes:
  db-data:
  objectstore-data:
